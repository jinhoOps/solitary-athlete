name: 문제 보고
description: 기록·조회·표시에서 발생한 문제를 알려 주세요.
title: "[문제] "
body:
  - type: markdown
    attributes:
      value: "토큰, 실제 사용자 ID, 비공개 운동 기록을 포함하지 마세요. 현재 설계 단계에서는 문서·시안의 문제도 제보할 수 있습니다."
  - type: textarea
    id: behavior
    attributes:
      label: 기대한 결과와 실제 결과
      description: 어느 문서나 기능에서 어떤 차이가 있었나요?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 확인한 순서와 사용한 환경을 적어 주세요. 날짜 문제라면 시간대도 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 확인 자료
      description: 개인정보와 비밀값을 지운 로그나 화면을 첨부해 주세요.
