  <title id="title">고독한 운동가 — 오늘도 묵묵히, 잔디 한 칸.</title>
  <desc id="desc">밝은 종이색 바탕, 작은 새싹 마크, 오른쪽에 조용히 쌓이는 운동 잔디. 기록을 챙기는 봇 묵묵.</desc>
  <rect width="1280" height="640" rx="24" fill="#F7F8F2"/>
  <g transform="translate(76 64)">
    <rect width="54" height="54" rx="13" fill="#326C43"/>
    <path d="M27 40V27" fill="none" stroke="#F7F8F2" stroke-width="3" stroke-linecap="round"/>
