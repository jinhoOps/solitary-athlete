  <g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
    <text x="148" y="101" font-size="27" font-weight="700" fill="#18271E">고독한 운동가</text>
    <text x="76" y="266" font-size="68" font-weight="700" fill="#18271E">오늘도 묵묵히,</text>
    <text x="76" y="354" font-size="68" font-weight="700" fill="#326C43">잔디 한 칸.</text>
    <text x="80" y="422" font-size="23" fill="#57665B">당신의 속도로 쌓아가는 운동 기록.</text>
    <rect x="76" y="506" width="208" height="48" rx="12" fill="#D9E9D9"/>
    <text x="99" y="538" font-size="21" font-weight="600" fill="#326C43">묵묵 · mukmuk</text>
    <text x="1204" y="550" text-anchor="end" font-size="17" fill="#57665B">SOLITARY ATHLETE</text>
  </g>
