<path d="M24 492h672" stroke="#D3DBD0"/>
<text x="24" y="518" font-size="12" fill="#57665B" font-weight="400">사진은 Discord에서 불러오며, 원본 삭제 시 표시가 중단될 수 있어요.</text>
<text x="24" y="553" font-size="12" fill="#57665B" font-weight="400">프리뷰는 한 줄 요약, 상세는 원문 줄바꿈을 보존합니다.</text>
