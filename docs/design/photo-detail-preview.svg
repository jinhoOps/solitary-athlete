<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="title desc">
<title id="title">기록 상세 · 개인과 전체의 공통 말풍선</title><desc id="desc">가상 기록. 전체·개인 상세의 메모와 사진 버튼을 같은 말풍선 안에 표시한다. 여러 줄 메모는 보존하고 닫기 버튼은 무테두리다.</desc>
<rect width="720" height="830" fill="#E8EDE4"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
